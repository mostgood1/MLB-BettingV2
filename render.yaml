services:
  - type: web
    name: mlb-betting-v2
    env: python
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --worker-class gthread --threads 2 --timeout 120 --max-requests 150 --max-requests-jitter 25
    disk:
      name: mlb-betting-v2-data
      mountPath: /opt/render/project/data
      sizeGB: 10
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MLB_BETTING_DATA_ROOT
        value: /opt/render/project/data
      - key: MLB_LIVE_LENS_DIR
        value: /opt/render/project/data/live_lens
      - key: MLB_ENABLE_LIVE_LENS_LOOP
        value: off
      - key: MLB_ENABLE_LIVE_LENS_BACKGROUND_REPORTS
        value: off
      - key: MLB_ENABLE_INLINE_SEASON_MANIFEST_REBUILD
        value: off
      - key: MLB_ENABLE_LIVE_PITCHER_OUTS_CORRECTION
        value: on
      - key: MLB_LIVE_PITCHER_OUTS_CORRECTION_PATH
        value: /opt/render/project/data/eval/live_pitcher_outs_correction.json
      - key: MLB_ENABLE_LIVE_PITCHER_STRIKEOUTS_CORRECTION
        value: on
      - key: MLB_LIVE_PITCHER_STRIKEOUTS_CORRECTION_PATH
        value: /opt/render/project/data/eval/live_pitcher_strikeouts_correction.json
      - key: MLB_PERSON_CACHE_MAXSIZE
        value: "256"
      - key: MLB_PERSON_GAMELOG_CACHE_MAXSIZE
        value: "128"
      - key: MLB_PERSON_SEASON_CACHE_MAXSIZE
        value: "256"
      - key: MLB_JSON_FILE_CACHE_MAXSIZE
        value: "64"
      - key: MLB_JSON_FILE_CACHE_MAX_BYTES
        value: "393216"
      - key: MLB_SCHEDULE_FETCH_CACHE_MAXSIZE
        value: "8"
      - key: MLB_SCHEDULE_REMOTE_CACHE_TTL_SECONDS
        value: "10"
      - key: MLB_LIVE_FEED_CACHE_TTL_SECONDS
        value: "3"
      - key: MLB_PAYLOAD_CACHE_MAX_ENTRIES
        value: "16"
      - key: MLB_PAYLOAD_CACHE_MAX_BYTES
        value: "8388608"
      - key: MLB_PAYLOAD_CACHE_MAX_ITEM_BYTES
        value: "1048576"
      - key: MLB_CARDS_CACHE_TTL_SECONDS
        value: "60"
      - key: MLB_CARDS_CONTEXT_CACHE_TTL_SECONDS
        value: "60"
      - key: MLB_ENABLE_CARDS_LIVE_FEED_ENRICHMENT
        value: off
      - key: MLB_LIVE_LENS_LOOP_INTERVAL_SECONDS
        value: "30"
      - key: MLB_LIVE_LENS_REPORT_REFRESH_INTERVAL_SECONDS
        value: "120"
      - key: MLB_LIVE_LENS_REPORT_MAX_AGE_SECONDS
        value: "180"
      - key: MLB_LIVE_ODDSAPI_REFRESH_INTERVAL_SECONDS
        value: "90"
      - key: MLB_CRON_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
  - type: cron
    name: mlb-betting-v2-live-lens-refresh
    runtime: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/render_live_lens_refresh.py
    envVars:
      - key: MLB_WEB_INTERNAL_HOST
        fromService:
          name: mlb-betting-v2
          type: web
          property: host
      - key: MLB_WEB_INTERNAL_PORT
        fromService:
          name: mlb-betting-v2
          type: web
          property: port
      - key: MLB_CRON_TOKEN
        fromService:
          name: mlb-betting-v2
          type: web
          envVarKey: MLB_CRON_TOKEN
      - key: MLB_LIVE_LENS_MARKET_REFRESH_INTERVAL_MINUTES
        value: "15"
      - key: MLB_CRON_REQUEST_TIMEOUT_SECONDS
        value: "180"